services:
  # ── Backend API Service ─────────────────────────────────────────────────────
  - type: web
    name: file-forge-api
    env: node
    region: ohio
    # Build command installs Node deps, LibreOffice, 7-Zip, and Puppeteer Chrome
    buildCommand: cd server && chmod +x render-build.sh && ./render-build.sh
    startCommand: cd server && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 4000
      - key: SOFFICE_PATH
        value: /usr/bin/soffice
      - key: PUPPETEER_CACHE_DIR
        value: ./.cache/puppeteer
      - key: DATABASE_URL
        sync: false # IMPORTANT: Set your MongoDB Atlas URI in the Render Dashboard

  # ── Frontend Client Service ──────────────────────────────────────────────────
  - type: web
    name: file-forge-ui
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: file-forge-api
          type: web
          property: host
