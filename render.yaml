services:
  # ── Backend API Service (Docker) ─────────────────────────────────────────────
  # Uses a Dockerfile so we can install system packages (LibreOffice, FFmpeg, 7-Zip, Chrome)
  - type: web
    name: file-forge-api
    env: docker
    region: ohio
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: PORT
        value: 4000
      - key: SOFFICE_PATH
        value: /usr/bin/soffice
      - key: PUPPETEER_CACHE_DIR
        value: /app/.cache/puppeteer
      - key: DATABASE_URL
        sync: false # IMPORTANT: Set your MongoDB Atlas URI in the Render Dashboard

  # ── Frontend Client Service ──────────────────────────────────────────────────
  - type: web
    name: file-forge-ui
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: file-forge-api
          type: web
          property: host
